name: Release build

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:all
      - name: Zip browser builds
        run: |
          cd dist-browsers
          for browser in chrome edge brave firefox; do
            (cd "$browser" && zip -r "../../tabsetu-${browser}-${{ github.ref_name }}.zip" .)
          done
      - uses: actions/upload-artifact@v6
        with:
          name: tabsetu-browser-builds-${{ github.ref_name }}
          path: tabsetu-*.zip
