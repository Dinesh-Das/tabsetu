name: Release build

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Dependency audit
        run: npm audit
      - name: Verify release
        run: npm run verify
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          REQUIRE_GOOGLE_CLIENT_ID: "true"
      - name: Verify OAuth client injection
        run: |
          if grep "__REPLACE_WITH_CLIENT_ID__" \
            dist-browsers/chrome/manifest.json \
            dist-browsers/edge/manifest.json \
            dist-browsers/brave/manifest.json \
            dist-browsers/firefox/manifest.json; then
            echo "OAuth client ID placeholder found in release artifacts."
            exit 1
          fi
      - name: Zip browser builds
        run: |
          cd dist-browsers
          for browser in chrome edge brave firefox; do
            (cd "$browser" && zip -r "../../tabsetu-${browser}-${{ github.ref_name }}.zip" .)
          done
      - uses: actions/upload-artifact@v6
        with:
          name: tabsetu-browser-builds-${{ github.ref_name }}
          path: tabsetu-*.zip
