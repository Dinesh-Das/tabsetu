name: Release build

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Zip dist
        run: zip -r tabsetu-${{ github.ref_name }}.zip dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tabsetu-${{ github.ref_name }}
          path: tabsetu-*.zip
