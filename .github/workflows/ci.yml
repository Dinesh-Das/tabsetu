name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Dependency audit
        run: npm audit

      - name: Verify types, lint, tests, browser packages, and compliance
        run: npm run verify
        env:
          GOOGLE_CLIENT_ID: tabsetu-ci.apps.googleusercontent.com

      - name: Check dist size
        run: |
          DIST_SIZE=$(du -sk dist | cut -f1)
          echo "dist/ size: ${DIST_SIZE}KB"
          if [ "$DIST_SIZE" -gt 5000 ]; then
            echo "::warning::dist/ exceeds 5MB -- check for bundle bloat"
          fi
