<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TabSetu — Signing In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .card {
      max-width: 420px;
      padding: 36px 28px;
      border-radius: 16px;
      background: rgba(22, 33, 62, 0.85);
      border: 1px solid rgba(100, 140, 200, 0.22);
      box-shadow: 0 18px 48px rgba(4, 10, 22, 0.48);
      text-align: center;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(100, 200, 255, 0.18);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .done { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Signing in to Google…</h1>
    <p id="message">Please wait while TabSetu completes the sign-in flow.</p>
  </div>
  <script>
    (function () {
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var spinner = document.getElementById("spinner");

      // Read the auth code from the current URL query parameters
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var state = params.get("state");
      var error = params.get("error");

      if (error || (!code && !state)) {
        spinner.style.display = "none";
        title.textContent = "Sign-in cancelled";
        title.classList.add("error");
        message.textContent = error
          ? "Google returned an error: " + error + ". You can close this tab."
          : "No authorization data was received. You can close this tab and try again.";
        return;
      }

      // Build the full redirect URL as the background script expects it
      var redirectUrl = window.location.href;

      // Send the redirect URL to the background service worker
      try {
        chrome.runtime.sendMessage(
          { type: "tabsetu:oauth-callback", redirectUrl: redirectUrl },
          function (response) {
            spinner.style.display = "none";
            if (response && response.ok) {
              title.textContent = "Signed in!";
              title.classList.add("done");
              message.textContent = "You can close this tab now.";
            } else {
              title.textContent = "Something went wrong";
              title.classList.add("error");
              message.textContent =
                "TabSetu could not complete the sign-in. Please close this tab and try again.";
            }
          }
        );
      } catch (err) {
        spinner.style.display = "none";
        title.textContent = "Connection error";
        title.classList.add("error");
        message.textContent =
          "Could not communicate with the TabSetu extension. Please close this tab and try again.";
      }
    })();
  </script>
</body>
</html>
