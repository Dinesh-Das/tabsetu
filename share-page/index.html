<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabSetu Share</title>
    <link rel="stylesheet" href="./share.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <span class="mark">TabSetu</span>
        <h1 id="session-name">Shared session</h1>
        <p id="session-description"></p>
      </header>
      <section class="panel">
        <div class="panel-head">
          <strong id="tab-count">0 tabs</strong>
          <button id="copy-links" type="button">Copy links</button>
        </div>
        <ol id="tabs"></ol>
      </section>
    </main>
    <script src="./share.js"></script>
  </body>
</html>
