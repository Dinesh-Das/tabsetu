<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TabSetu - Mobile Save Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/css">
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#eeeeee",
                        "secondary": "#5d5e66",
                        "on-primary-fixed": "#1c1b1b",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#63646c",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary-fixed-variant": "#454749",
                        "on-primary-container": "#858383",
                        "secondary-fixed-dim": "#c6c5cf",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#1a1b22",
                        "secondary-container": "#e3e1ec",
                        "primary": "#000000",
                        "on-surface": "#1a1c1c",
                        "error": "#ba1a1a",
                        "primary-container": "#1c1b1b",
                        "on-secondary-fixed-variant": "#46464e",
                        "tertiary-container": "#1a1c1e",
                        "background": "#f9f9f9",
                        "surface-dim": "#dadada",
                        "outline-variant": "#c4c7c7",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface": "#f9f9f9",
                        "surface-bright": "#f9f9f9",
                        "on-primary-fixed-variant": "#474646",
                        "secondary-fixed": "#e3e1ec",
                        "outline": "#747878",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#5f5e5e",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2f3131",
                        "primary-fixed": "#e5e2e1",
                        "on-background": "#1a1c1c",
                        "inverse-on-surface": "#f0f1f1",
                        "surface-variant": "#e2e2e2",
                        "surface-container-highest": "#e2e2e2",
                        "on-tertiary-fixed": "#1a1c1e",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-error-container": "#93000a",
                        "tertiary": "#000000",
                        "tertiary-fixed": "#e2e2e5",
                        "tertiary-fixed-dim": "#c6c6c9",
                        "on-tertiary-container": "#838487",
                        "surface-container-high": "#e8e8e8",
                        "surface-container-low": "#f3f3f3",
                        "on-surface-variant": "#444748"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "64px",
                        "gutter": "24px",
                        "xs": "4px",
                        "md": "24px",
                        "sm": "12px",
                        "lg": "40px",
                        "base": "8px",
                        "margin": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-sm": ["10px", {"lineHeight": "1", "fontWeight": "500"}],
                        "label-md": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-lg": ["30px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface antialiased h-screen w-full flex items-center justify-center relative overflow-hidden">
<!-- Background context (dimmed out) -->
<div aria-hidden="true" class="absolute inset-0 bg-background flex flex-col pt-16 px-6 z-0">
<div class="w-full max-w-md mx-auto space-y-4 opacity-50 pointer-events-none">
<!-- Simulated background content -->
<div class="h-24 bg-surface-container rounded-xl w-full"></div>
<div class="h-32 bg-surface-container rounded-xl w-full"></div>
<div class="h-20 bg-surface-container rounded-xl w-full"></div>
<div class="h-40 bg-surface-container rounded-xl w-full"></div>
</div>
</div>
<!-- Dimming Overlay -->
<div class="absolute inset-0 bg-black/40 backdrop-blur-sm z-10 transition-opacity"></div>
<!-- Bottom Sheet Modal -->
<div class="absolute bottom-0 w-full max-w-md bg-white/90 backdrop-blur-[40px] rounded-t-[32px] border-t border-white/40 shadow-[0_-8px_40px_rgba(0,0,0,0.12)] z-20 flex flex-col max-h-[795px]">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
<!-- Header -->
<div class="px-6 pb-4 flex flex-col gap-1">
<h2 class="font-headline-md text-headline-md text-on-surface">Save 1 tab</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Organize before saving</p>
</div>
<!-- Scrollable Content -->
<div class="px-6 overflow-y-auto flex-1 space-y-6 pb-6 scrollbar-hide">
<!-- Folder Section -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Folder</span>
<button class="text-primary p-1 rounded-full hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
<div class="bg-surface-container/50 rounded-xl border border-white/40 overflow-hidden divide-y divide-outline-variant/20">
<button class="w-full flex items-center justify-between px-4 py-3 bg-white/50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-body-sm text-body-sm text-on-surface font-medium">Design Inspiration</span>
</div>
<span class="material-symbols-outlined text-primary text-[20px]">check</span>
</button>
<button class="w-full flex items-center justify-between px-4 py-3 hover:bg-white/30 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary text-[20px]">folder</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Dev Resources</span>
</div>
</button>
<button class="w-full flex items-center justify-between px-4 py-3 hover:bg-white/30 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary text-[20px]">folder</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">To Read</span>
</div>
</button>
</div>
</div>
<!-- Tags Section -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Tags</span>
</div>
<div class="flex flex-wrap gap-2">
<button class="px-3 py-1.5 bg-surface-container/80 border border-white/60 rounded-full flex items-center gap-1.5 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[16px] text-secondary">sell</span>
<span class="font-label-md text-label-md text-on-surface">UI/UX</span>
</button>
<button class="px-3 py-1.5 bg-primary border border-primary rounded-full flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-on-primary">sell</span>
<span class="font-label-md text-label-md text-on-primary">CSS</span>
</button>
<button class="px-3 py-1.5 bg-surface-container/80 border border-white/60 rounded-full flex items-center gap-1.5 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[16px] text-secondary">sell</span>
<span class="font-label-md text-label-md text-on-surface">Reference</span>
</button>
<button class="px-3 py-1.5 bg-surface-container/40 border border-dashed border-outline/40 rounded-full flex items-center gap-1.5 hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">add</span>
<span class="font-label-md text-label-md">New Tag</span>
</button>
</div>
</div>
<!-- Group Section -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Group</span>
</div>
<button class="w-full bg-surface-container/50 border border-white/40 rounded-xl px-4 py-3 flex items-center justify-between hover:bg-surface-variant/50 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary text-[20px]">tab_group</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">None selected</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">chevron_right</span>
</button>
</div>
</div>
<!-- Sticky Footer Area -->
<div class="px-6 pt-4 pb-8 bg-white/60 backdrop-blur-md border-t border-white/40 flex flex-col gap-4 relative z-30">
<!-- Toggle -->
<div class="flex items-center justify-between">
<label class="font-body-sm text-body-sm text-on-surface flex-1" for="close-tabs-toggle">Close tabs after saving</label>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-container appearance-none cursor-pointer checked:right-0 checked:border-primary transition-all duration-300 z-10" id="close-tabs-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer" for="close-tabs-toggle"></label>
</div>
<!-- Custom CSS for toggle specifically since Tailwind arbitrary variants are complex for this specific visual -->
<style>
                    #close-tabs-toggle:checked + .toggle-label {
                        background-color: var(--tw-colors-primary, #000000);
                    }
                    #close-tabs-toggle:checked {
                        transform: translateX(100%);
                        border-color: var(--tw-colors-primary, #000000);
                    }
                </style>
</div>
<!-- CTA -->
<button class="w-full bg-primary text-on-primary font-body-md text-body-md font-medium py-3.5 rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.15)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">save</span>
                Save 1 tab
            </button>
</div>
</div>
</body></html>
