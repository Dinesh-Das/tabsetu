</div>
<input class="w-full bg-surface-container/60 backdrop-blur-md border border-white/40 rounded-full py-sm pl-lg pr-sm text-body-sm font-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary/20 shadow-sm transition-all bg-blend-overlay" placeholder="Search notes..." type="text"/>
</div>

<button class="w-10 h-10 rounded-full bg-surface-container/60 backdrop-blur-md border border-white/40 flex items-center justify-center text-on-surface-variant hover:bg-white/40 hover:text-primary transition-colors shadow-sm">
<span class="material-symbols-outlined text-[20px]">filter_list</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container/60 backdrop-blur-md border border-white/40 flex items-center justify-center text-on-surface-variant hover:bg-white/40 hover:text-primary transition-colors shadow-sm">

</button>
