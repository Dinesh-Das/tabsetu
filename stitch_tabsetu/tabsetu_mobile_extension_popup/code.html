<style>
        body {
            /* Simulating a mobile extension popup environment on desktop, full width on mobile */
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        #extension-root {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: linear-gradient(to bottom right, #f9f9f9, #e8e8e8);
        }
        @media (min-width: 450px) {
            #extension-root {
                height: 85vh;
                border-radius: 24px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.1);
                border: 1px solid rgba(255,255,255,0.8);
            }
        }

        /* Custom Checkbox Styling for Monochrome Theme */
        .custom-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 1.5px solid var(--tw-colors-outline-variant);
            border-radius: 4px;
            background-color: var(--tw-colors-surface-container-lowest);
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .custom-checkbox::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 0.12s transform ease-in-out;
            box-shadow: inset 1em 1em var(--tw-colors-on-primary);
            background-color: var(--tw-colors-on-primary);
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: var(--tw-colors-primary);
            border-color: var(--tw-colors-primary);
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }
    </style>
<style>
